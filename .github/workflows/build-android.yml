# ============================================================================
# MeetingMind · Android APK 云端构建工作流
# ----------------------------------------------------------------------------
# 用途：无需在本机安装任何工具（JDK / Rust / Android SDK / NDK），
#       推代码到 GitHub 后，云端自动构建出 Android APK，
#       你直接用手机浏览器从 Actions 的 Artifacts 下载安装即可。
#
# 使用方式：
#   1) 把本仓库推到 GitHub（含此文件与 src-tauri/、src/ 等）。
#   2) GitHub 仓库 → Actions → 选择 “Build Android APK” → Run workflow。
#      （默认 push 到 main/master 也会自动触发）
#   3) 构建完成后，在运行记录里下载 Artifact “meetingmind-apk”，
#      把里面的 *.apk（建议 arm64-v8a）传到手机安装。
# ============================================================================

name: Build Android APK

on:
  workflow_dispatch: {}
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    # 注意：job 级 env 只放字面量；ANDROID_HOME / ANDROID_NDK_HOME 等路径变量
    # 在 “Setup Android SDK & NDK” 步骤里通过 >> $GITHUB_ENV 注入后续步骤。
    env:
      NDK_VERSION: "25.2.9519653"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Rust 工具链 + 4 个 Android 目标架构
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # 不使用 android-actions/setup-android：其 v3 会去安装 Google 已下线的 "tools" 包，
      # 导致 sdkmanager 退出码 1 而失败。GitHub 运行机本身已预装 Android SDK
      # （/usr/local/lib/android/sdk），这里直接复用，仅安装仍然有效的包。
      - name: Setup Android SDK & NDK
        run: |
          set -euo pipefail
          export ANDROID_HOME="/usr/local/lib/android/sdk"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          # cmdline-tools 的版本目录不写死，动态查找（如 cmdline-tools/16.0/bin）
          CT_BIN="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin 2>/dev/null | head -1)"
          echo "${CT_BIN:-$ANDROID_HOME/cmdline-tools/latest/bin}" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          # 接受许可协议
          yes | sdkmanager --licenses >/dev/null || true
          # 仅安装仍然有效的包（不再引用已被下线的 tools）
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools" "ndk;${NDK_VERSION}"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/ndk/${NDK_VERSION}" >> "$GITHUB_PATH"

      - name: Install npm dependencies
        run: npm install

      # 若仓库里没有图标源图，先用 Python 标准库生成一个 1024x1024 占位图
      - name: Ensure app icon source
        run: |
          if [ ! -f src-tauri/icons/logo.png ]; then
            python3 - <<'PY'
          import zlib, struct
          W=H=1024; color=(30,58,138)
          raw=bytearray()
          for y in range(H):
              raw.append(0)
              for x in range(W): raw += bytes(color)
          comp=zlib.compress(bytes(raw),9)
          def ch(t,d):
              c=t+d; return struct.pack('>I',len(d))+c+struct.pack('>I',zlib.crc32(c)&0xffffffff)
          p=b'\x89PNG\r\n\x1a\n'+ch(b'IHDR',struct.pack('>IIBBBBB',W,H,8,2,0,0,0))+ch(b'IDAT',comp)+ch(b'IEND',b'')
          open('src-tauri/icons/logo.png','wb').write(p)
          PY
          fi

      # 由 logo.png 生成 Tauri 所需的各尺寸/格式图标
      - name: Generate Tauri icons
        run: npm run tauri icon src-tauri/icons/logo.png

      # 首次需在 CI 里初始化 Android 工程（src-tauri/gen/android 默认被 gitignore）
      - name: Init Tauri Android project
        run: npm run tauri android init

      - name: Build Android APK (debug, 可直接侧载安装)
        run: npm run tauri android build

      - name: List built APKs (debug)
        run: find src-tauri/gen/android -name "*.apk" -print

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: meetingmind-apk
          path: src-tauri/gen/android/**/*.apk
          if-no-files-found: error
