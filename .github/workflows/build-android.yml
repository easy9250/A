# ============================================================================
# MeetingMind · Android APK 云端构建工作流
# ----------------------------------------------------------------------------
# 用途：无需在本机安装任何工具（JDK / Rust / Android SDK / NDK），
#       推代码到 GitHub 后，云端自动构建出 Android APK，
#       你直接用手机浏览器从 Actions 的 Artifacts 下载安装即可。
#
# 使用方式：
#   1) 把本仓库推到 GitHub（含此文件与 src-tauri/、src/ 等）。
#   2) GitHub 仓库 → Actions → 选择 “Build Android APK” → Run workflow。
#      （默认 push 到 main/master 也会自动触发）
#   3) 构建完成后，在运行记录里下载 Artifact “meetingmind-apk”，
#      把里面的 *.apk（建议 arm64-v8a）传到手机安装。
# ============================================================================

name: Build Android APK

on:
  workflow_dispatch: {}
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    # 注意：job 级 env 只放字面量；ANDROID_HOME / ANDROID_NDK_HOME 等路径变量
    # 在 “Setup Android SDK & NDK” 步骤里通过 >> $GITHUB_ENV 注入后续步骤。
    env:
      NDK_VERSION: "25.2.9519653"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Rust 工具链 + 4 个 Android 目标架构
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # 不使用 android-actions/setup-android：其 v3 会去安装 Google 已下线的 "tools" 包而必失败；
      # 也不依赖 runner 预装（实测 ubuntu-latest 并未预装 Android SDK）。
      # 这里直接从官方下载 command-line tools 并自行安装。
      - name: Setup Android SDK & NDK
        run: |
          set -euo pipefail
          export ANDROID_HOME="$HOME/android-sdk"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          # 下载官方 command-line tools（约 150MB）
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -fsSL -o /tmp/cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/cmdline-tools.zip -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          # 关键：同一步骤内 >> $GITHUB_PATH 不会让“当前 shell”的 PATH 立即生效，必须显式 export
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          # 自检：确认 sdkmanager 已就位，否则给出清晰报错
          command -v sdkmanager >/dev/null || { echo "sdkmanager 未安装成功，目录内容如下："; ls -la "$ANDROID_HOME/cmdline-tools/latest/bin" 2>&1; exit 1; }
          # 接受许可协议，并安装仍然有效的包（不再引用已被下线的 tools）
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools" "ndk;${NDK_VERSION}"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/ndk/${NDK_VERSION}" >> "$GITHUB_PATH"

      - name: Install npm dependencies
        run: npm install

      # 若仓库里没有图标源图，先用 Python 标准库生成一个 1024x1024 占位图
      - name: Ensure app icon source
        run: |
          if [ ! -f src-tauri/icons/logo.png ]; then
            python3 - <<'PY'
          import zlib, struct
          W=H=1024; color=(30,58,138)
          raw=bytearray()
          for y in range(H):
              raw.append(0)
              for x in range(W): raw += bytes(color)
          comp=zlib.compress(bytes(raw),9)
          def ch(t,d):
              c=t+d; return struct.pack('>I',len(d))+c+struct.pack('>I',zlib.crc32(c)&0xffffffff)
          p=b'\x89PNG\r\n\x1a\n'+ch(b'IHDR',struct.pack('>IIBBBBB',W,H,8,2,0,0,0))+ch(b'IDAT',comp)+ch(b'IEND',b'')
          open('src-tauri/icons/logo.png','wb').write(p)
          PY
          fi

      # 由 logo.png 生成 Tauri 所需的各尺寸/格式图标
      - name: Generate Tauri icons
        run: npm run tauri icon src-tauri/icons/logo.png

      # 首次需在 CI 里初始化 Android 工程（src-tauri/gen/android 默认被 gitignore）
      - name: Init Tauri Android project
        run: npm run tauri android init

      # Tauri 2 的 bundle.android 不再支持 permissions 字段，改为直接写入生成的 AndroidManifest.xml
      - name: Ensure Android mic/internet permission
        run: |
          set -euo pipefail
          MF=src-tauri/gen/android/app/src/main/AndroidManifest.xml
          python3 - "$MF" <<'PY'
          import sys, re
          p = sys.argv[1]
          s = open(p, encoding='utf-8').read()
          for perm in ("android.permission.RECORD_AUDIO", "android.permission.INTERNET"):
              if perm not in s:
                  s = re.sub(r'(<manifest\b[^>]*>)', r'\1\n    <uses-permission android:name="%s"/>' % perm, s, count=1)
                  print("added", perm)
          open(p, "w", encoding="utf-8").write(s)
          PY

      - name: Build universal debug APK (4 架构通用，体积较大)
        run: npm run tauri -- android build --debug

      # 精简 release 包：仅 arm64（现代安卓手机通用），去掉调试符号后体积小得多，
      # 更适合传到手机安装。失败不影响主流程（此时仍可用上面的通用调试包）。
      - name: Build slim arm64 release APK (可选产物)
        continue-on-error: true
        run: npm run tauri -- android build --target aarch64 --apk

      - name: Collect built APKs
        run: |
          set -euo pipefail
          mkdir -p dist-apk
          find src-tauri/gen/android -name "*.apk" -exec cp {} dist-apk/ \;
          ls -la dist-apk/

      # 安卓不允许安装未签名的包，而 Tauri 在没配置 keystore 时不会自动签名。
      # 这里在 CI 内生成一个自签名 keystore 完成签名（仅用于侧载体验；
      # 正式上架请改用你自己的发布密钥，并妥善保管）。
      - name: Sign release APK
        run: |
          set -euo pipefail
          KEYSTORE=/tmp/meetingmind.keystore
          "$JAVA_HOME/bin/keytool" -genkeypair -v \
            -keystore "$KEYSTORE" -alias meetingmind \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass meetingmind -keypass meetingmind \
            -dname "CN=MeetingMind, OU=Dev, O=MeetingMind, L=Shanghai, ST=Shanghai, C=CN"
          BT="$(ls -d "$ANDROID_HOME"/build-tools/*/ | head -1)"
          APKSIGNER="${BT}apksigner"
          ZIPALIGN="${BT}zipalign"
          echo "apksigner=$APKSIGNER"; echo "zipalign=$ZIPALIGN"
          "$APKSIGNER" version
          shopt -s nullglob
          UNSIGNED=(dist-apk/*-unsigned.apk)
          for f in "${UNSIGNED[@]}"; do
            OUT="dist-apk/MeetingMind-v1.0.0-android-release.apk"
            "$ZIPALIGN" -p -f 4 "$f" "$OUT"
            "$APKSIGNER" sign \
              --ks "$KEYSTORE" --ks-pass pass:meetingmind --key-pass pass:meetingmind \
              --min-sdk-version 24 \
              --out "$OUT.signed" "$OUT"
          mv "$OUT.signed" "$OUT"
          rm -f "$f"
          echo "signed -> $OUT ($(wc -c < "$OUT") bytes)"
          done
          "$APKSIGNER" verify --print-certs "$OUT" | head -20
          ls -la dist-apk/

      # 发布到 GitHub Release：得到永久有效的直链下载地址
      # （Actions Artifact 90 天后会过期，Release 不会）
      - name: Publish APKs to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v1.0.0-android
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "MeetingMind Android APK" --notes "由 GitHub Actions 云端构建" --target main
          fi
          for f in dist-apk/*.apk; do
            echo ">>> uploading $f"
            gh release upload "$TAG" "$f" --clobber
          done
          gh release view "$TAG" --json url,assets

      - name: Upload APK artifact (备份通道)
        uses: actions/upload-artifact@v4
        with:
          name: meetingmind-apk
          path: dist-apk/*.apk
          if-no-files-found: error
