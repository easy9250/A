# ============================================================================
# MeetingMind · Android APK 云端构建工作流
# ----------------------------------------------------------------------------
# 用途：无需在本机安装任何工具（JDK / Rust / Android SDK / NDK），
#       推代码到 GitHub 后，云端自动构建出 Android APK，
#       你直接用手机浏览器从 Actions 的 Artifacts 下载安装即可。
#
# 使用方式：
#   1) 把本仓库推到 GitHub（含此文件与 src-tauri/、src/ 等）。
#   2) GitHub 仓库 → Actions → 选择 “Build Android APK” → Run workflow。
#      （默认 push 到 main/master 也会自动触发）
#   3) 构建完成后，在运行记录里下载 Artifact “meetingmind-apk”，
#      把里面的 *.apk（建议 arm64-v8a）传到手机安装。
# ============================================================================

name: Build Android APK

on:
  workflow_dispatch: {}
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    env:
      # Tauri 2 默认使用的 NDK 版本；若 gradle 报 NDK 版本不匹配，
      # 改这里与下方 sdkmanager 安装的 ndk 版本即可。
      NDK_VERSION: "25.2.9519653"
      ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/25.2.9519653

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Rust 工具链 + 4 个 Android 目标架构
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      # cargo-ndk：把 Rust 编译为 Android 可用的 .so
      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android packages & accept licenses
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;${NDK_VERSION}"

      - name: Install npm dependencies
        run: npm install

      # 若仓库里没有图标源图，先用 Python 标准库生成一个 1024x1024 占位图
      - name: Ensure app icon source
        run: |
          if [ ! -f src-tauri/icons/logo.png ]; then
            python3 - <<'PY'
          import zlib, struct
          W=H=1024; color=(30,58,138)
          raw=bytearray()
          for y in range(H):
              raw.append(0)
              for x in range(W): raw += bytes(color)
          comp=zlib.compress(bytes(raw),9)
          def ch(t,d):
              c=t+d; return struct.pack('>I',len(d))+c+struct.pack('>I',zlib.crc32(c)&0xffffffff)
          p=b'\x89PNG\r\n\x1a\n'+ch(b'IHDR',struct.pack('>IIBBBBB',W,H,8,2,0,0,0))+ch(b'IDAT',comp)+ch(b'IEND',b'')
          open('src-tauri/icons/logo.png','wb').write(p)
          PY
          fi

      # 由 logo.png 生成 Tauri 所需的各尺寸/格式图标
      - name: Generate Tauri icons
        run: npm run tauri icon src-tauri/icons/logo.png

      # 首次需在 CI 里初始化 Android 工程（src-tauri/gen/android 默认被 gitignore）
      - name: Init Tauri Android project
        run: npm run tauri android init

      - name: Build Android APK (debug, 可直接侧载安装)
        run: npm run tauri android build
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}

      - name: List built APKs (debug)
        run: find src-tauri/gen/android -name "*.apk" -print

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: meetingmind-apk
          path: src-tauri/gen/android/**/*.apk
          if-no-files-found: error
